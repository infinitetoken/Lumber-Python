name: CI
run-name: CI - ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # tests/contract must be Lumber-Kit's contract at the version in tests/contract/VERSION
      - run: python scripts/sync_contract.py && git diff --exit-code tests/contract

  test:
    # Ubuntu 26.04 (ubuntu-latest) has no Python 3.9 for setup-python; 24.04 has every version here
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest jsonschema
      - run: pytest
